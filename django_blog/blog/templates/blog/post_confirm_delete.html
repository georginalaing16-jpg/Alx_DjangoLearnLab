{% extends "blog/base.html" %}
{% block title %}Delete Post{% endblock %}

{% block content %}
<h1>Delete Post</h1>

<div class="card">
  <p>Are you sure you want to delete:</p>
  <h2>{{ object.title }}</h2>
</div>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn">Yes, delete</button>
  <a class="btn" href="{% url 'blog:post_detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
